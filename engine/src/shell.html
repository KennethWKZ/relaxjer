<header class="bar" id="bar">
  <div class="bar-row" id="bar-main">
    <a class="brand" href="#top" aria-label="{{brand}}"><span class="brand-name">{{brand}}</span><span class="brand-dates" id="brand-dates">{{dates}}</span></a>
    <button type="button" class="icon-btn home-hd" id="homeBtn" data-home hidden><svg class="i" aria-hidden="true"><use href="#i-install"/></svg><span class="home-lab"></span></button>
    <button type="button" class="icon-btn" id="searchBtn" aria-label="搜索"><svg class="i" aria-hidden="true"><use href="#i-search"/></svg></button>
    <button type="button" class="icon-btn" id="themeBtn" aria-label="主题：跟随系统"><svg class="i" aria-hidden="true"><use href="#i-auto"/></svg></button>
    <button type="button" class="icon-btn lang-btn" id="langBtn" data-lang="en" lang="en">EN</button>
  </div>
  <div class="search-row" id="search-row" hidden>
    <label class="search-field" for="q"><svg class="i" aria-hidden="true"><use href="#i-search"/></svg><input id="q" type="search" enterkeyhint="search" autocomplete="off" autocapitalize="off" spellcheck="false" aria-controls="results"><span class="search-count" id="search-count" aria-live="polite"></span></label>
    <button type="button" class="icon-btn" id="search-prev" aria-label="Previous / 上一个"><svg class="i" aria-hidden="true" style="transform:rotate(180deg)"><use href="#i-chev"/></svg></button>
    <button type="button" class="icon-btn" id="search-next" aria-label="Next / 下一个"><svg class="i" aria-hidden="true"><use href="#i-chev"/></svg></button>
    <button type="button" class="text-btn" id="searchClose">完成</button>
  </div>
  <nav class="tabs" id="tabs" aria-label="Sections 目录"></nav>
  <p class="net-off" id="netOff" role="status" hidden></p>
  <p class="upd" id="updBar" role="status" hidden></p>
  <div class="results" id="results" data-state="closed"><div class="results-inner" id="results-inner" role="list"></div></div>
</header>

<main id="app"></main>
<footer class="foot" id="foot"></footer>

<div class="toast" id="toast" role="status" data-state="closed"></div>

<dialog class="sheet" id="driver" aria-labelledby="drv-name">
  <div class="sheet-in">
    <p class="xsmall" lang="zh-Hant">請載我們到這裡，謝謝！ · Please take us here, thank you.</p>
    <p class="driver-name" id="drv-name" lang="zh-Hant"></p>
    <p class="driver-say" id="drv-alt" lang="zh-Hant"></p>
    <p class="driver-addr" id="drv-addr" lang="zh-Hant"></p>
    <p class="small muted" id="drv-en"></p>
    <p class="small" id="drv-tel"></p>
    <div class="links-row">
      <button type="button" class="go-btn" id="drv-copy" data-text=""><svg class="i" aria-hidden="true"><use href="#i-copy"/></svg>复制地址 Copy</button>
      <a class="go-btn ghost" id="drv-map" href="#" target="_blank" rel="noopener"><svg class="i" aria-hidden="true"><use href="#i-pin"/></svg>Google Maps</a>
      <button type="button" class="go-btn ghost" data-close>关闭 Close</button>
    </div>
  </div>
</dialog>

<button type="button" class="toc-fab" id="tocBtn" aria-haspopup="dialog" aria-controls="toc" data-show="0" tabindex="-1"><svg class="i" aria-hidden="true"><use href="#i-list"/></svg><span class="dlbl" id="toc-lab">目录</span></button>
<button type="button" class="back-pill" id="backPill" data-show="0" aria-label="返回刚才的位置 Back"><svg class="i" aria-hidden="true"><use href="#i-arrow"/></svg><span class="dlbl" id="back-lab">返回刚才</span></button>
<dialog class="sheet psheet" id="placeSheet" aria-label="地点 Place"></dialog>
<dialog class="sheet toc" id="toc" aria-labelledby="toc-h"><div class="sheet-in" id="toc-in"></div></dialog>
<dialog class="sheet toc near" id="near" aria-labelledby="near-h"><div class="sheet-in" id="near-in"></div></dialog>

<dialog class="sheet" id="copydlg" aria-label="Copy">
  <div class="sheet-in">
    <p class="small">长按选择全部，再复制 · Long-press to select all, then copy.</p>
    <textarea id="copytext" readonly></textarea>
    <div class="links-row"><button type="button" class="go-btn" data-close>好 OK</button></div>
  </div>
</dialog>

# Actions use their latest major version tag, so fixes arrive on their own (Kenneth's call, 2026-10-01).
name: ci
# a pull request runs ci once, as the pull request; a push runs it only on main (merges and the maintainer's own pushes,
# whose ci run the release job waits for), not again for the branch behind a pull request. The release job starts it on
# the release pull request (workflow_dispatch), whose own run GitHub holds for an approval.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # whether the change needs the browser tests: not when it only touches docs or release bookkeeping
  # (scripts/ci/needs-e2e.mjs). The workflow itself always runs, so the required ci-ok always reports.
  changes:
    runs-on: ubuntu-latest
    outputs:
      e2e: ${{ steps.diff.outputs.e2e }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the base commit to compare with
      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before || 'origin/main' }}
        run: node scripts/ci/needs-e2e.mjs "$BASE" >> "$GITHUB_OUTPUT"

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # scan the whole history, not just the tip
      - name: gitleaks (checksum-verified binary)
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          file="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfLO "$base/$file" && curl -sSfLO "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          sha256sum --check --ignore-missing "gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          tar -xzf "$file" gitleaks
          ./gitleaks git --redact --no-banner --config .gitleaks.toml

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6 # the pnpm version comes from package.json "packageManager"
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: astral-sh/setup-uv@v10.2.0 # setup-uv has no v10 major tag: its latest release; the data pipeline's offline tests (pipeline/)
      - run: pnpm verify # lint + format check + fast tests + pipeline tests

  # one job per Playwright project and half of its tests, side by side: on one runner the four ran almost one at a
  # time (40+ min). Inside Playwright's own image, whose browsers and their system packages are already installed:
  # installing WebKit's packages on the bare runner took under a minute most days and 20 on a slow one
  # (ADR-20261002-ci-image-and-releases). The image's version must match @playwright/test (tests/repo/ci.test.mjs).
  e2e:
    needs: changes
    if: ${{ needs.changes.outputs.e2e == 'true' }}
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --user 1001 # the runner's own user, so the checkout and caches are writable
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        project: [android-390, chromium-1280, webkit-390, webkit-1280]
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright test --project=${{ matrix.project }} --shard=${{ matrix.shard }}/2
      # the same trip-agnostic suite on a 4-day trip made from the demo
      - run: node tests/support/short-trip.mjs && TRIP_DIR=.cache/trips/short-trip pnpm exec playwright test --grep-invert @demo --project=${{ matrix.project }} --shard=${{ matrix.shard }}/2
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ matrix.project }}-${{ matrix.shard }}
          path: playwright-report/
          retention-days: 7

  # the one check main's ruleset requires (ADR-20261002-required-ci): it passes only when every job above passed, so a
  # red ci blocks the merge. The browser tests may be skipped only when the changes job said so. A new job joins the
  # gate by being listed in needs (tests/repo/ci.test.mjs checks).
  ci-ok:
    if: always()
    needs: [changes, secrets, test, e2e]
    runs-on: ubuntu-latest
    steps:
      - name: every job passed
        env:
          NEEDS: ${{ toJSON(needs) }}
          WANT_E2E: ${{ needs.changes.outputs.e2e }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$NEEDS" | jq -e --arg want "$WANT_E2E" \
            'to_entries | all(.value.result == "success" or (.key == "e2e" and .value.result == "skipped" and $want == "false"))'

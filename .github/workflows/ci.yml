# Actions use their latest major version tag, so fixes arrive on their own (Kenneth's call, 2026-10-01).
name: ci
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # scan the whole history, not just the tip
      - name: gitleaks (checksum-verified binary)
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          file="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfLO "$base/$file" && curl -sSfLO "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          sha256sum --check --ignore-missing "gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          tar -xzf "$file" gitleaks
          ./gitleaks git --redact --no-banner --config .gitleaks.toml

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6 # the pnpm version comes from package.json "packageManager"
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: astral-sh/setup-uv@v10.2.0 # setup-uv has no v10 major tag: its latest release; the data pipeline's offline tests (pipeline/)
      - run: pnpm verify # lint + format check + fast tests + pipeline tests

  # one job per Playwright project, side by side: on one runner the four ran almost one at a time (40+ min)
  e2e:
    runs-on: ubuntu-latest
    # installing WebKit's system packages alone has taken 14 minutes on a slow day
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        project: [android-390, chromium-1280, webkit-390, webkit-1280]
    env:
      BROWSER: ${{ startsWith(matrix.project, 'webkit') && 'webkit' || 'chromium' }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile && pnpm exec playwright install --with-deps "$BROWSER"
      - run: pnpm exec playwright test --project=${{ matrix.project }}
      # the same trip-agnostic suite on a 4-day trip made from the demo
      - run: node tests/support/short-trip.mjs && TRIP_DIR=.cache/trips/short-trip pnpm exec playwright test --grep-invert @demo --project=${{ matrix.project }}
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ matrix.project }}
          path: playwright-report/
          retention-days: 7

# The landing page and the live demos on GitHub Pages. site/ goes up as it is (static HTML, no build); the demos are the
# synthetic demo trips, Taipei (examples/demo-trip) at /relaxjer/demo/ and Sapporo (examples/demo-sapporo) at
# /relaxjer/demo/sapporo/, built here with no Google key and no sync file, each clock set to a day under way
# (ADR-20261002-live-demo-on-pages). Never a real trip: only the two demo folders are built, and
# tests/repo/site.test.mjs holds this file to that. Enable once in the repo: Settings → Pages → Source: GitHub Actions.
# Actions are pinned to commit SHAs (story index, "CI supply chain"); the comment names the release.
name: pages
on:
  push:
    branches: [main]
    # the demos' inputs: build.mjs reads engine/ and the trip (with its country pack); add a path if it reads more
    paths:
      - 'site/**'
      - 'engine/**'
      - 'examples/demo-trip/**'
      - 'examples/demo-sapporo/**'
      - 'destinations/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

# Two jobs, as GitHub's own Pages workflow has them: build uploads the site, deploy publishes it once build has finished.
# In one job, deploy-pages looked for the artifact moments after its upload and sometimes found none ("Found 0
# artifact(s)", four times on 2026-11-24); and a re-run of that one job uploaded a second copy, which deploy-pages
# refuses ("Multiple artifacts named github-pages"). Split, a failed deploy re-runs alone, against the one artifact.
# arm64 runners (free on a public repo), as ci.yml's
jobs:
  build:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: the demo stays synthetic (tier 0, with the trip contract), and nothing published names a real trip
        run: pnpm test && pnpm test:release
      - name: build the demo trip, with no Google key and no sync file
        run: |
          set -o pipefail
          mkdir -p .cache/demo
          node engine/build.mjs --trip examples/demo-trip --out .cache/demo --demo-clock "2027-03-15 10:05" | tee .cache/demo/build.log
          grep -q 'google key no · group sync no · demo clock 2027-03-15 10:05' .cache/demo/build.log
          mkdir -p .cache/demo-sapporo
          node engine/build.mjs --trip examples/demo-sapporo --out .cache/demo-sapporo --demo-clock "2027-02-08 10:35" | tee .cache/demo-sapporo/build.log
          grep -q 'google key no · group sync no · demo clock 2027-02-08 10:35' .cache/demo-sapporo/build.log
      - name: stage the landing page with the demo at demo/
        run: |
          mkdir -p _site/demo/sapporo
          cp -R site/. _site/
          cp .cache/demo/trip-standalone.html _site/demo/index.html
          cp .cache/demo-sapporo/trip-standalone.html _site/demo/sapporo/index.html
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-24.04-arm
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
